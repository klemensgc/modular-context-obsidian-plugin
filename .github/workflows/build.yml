name: Build Check

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: "npm"

            - run: npm ci

            - name: Build shipped packages (shared → mcp-google → plugin; packages/app is experimental WIP and excluded from CI)
              run: npm run build:shared && npm run build:mcp-google && npm run build:plugin

            - name: Type check — shared
              run: cd packages/shared && npx tsc --noEmit

            - name: Type check — plugin
              run: cd packages/plugin && npx tsc --noEmit

            - name: Type check — mcp-google
              run: cd packages/mcp-google && NODE_OPTIONS='--max-old-space-size=8192' npx tsc --noEmit
