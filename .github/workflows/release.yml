name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: "npm"

            - run: npm ci

            - name: Write .env.local so esbuild bakes Quick Connect creds into main.js
              working-directory: packages/plugin
              env:
                  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
                  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
              run: |
                  printf 'GOOGLE_OAUTH_CLIENT_ID=%s\nGOOGLE_OAUTH_CLIENT_SECRET=%s\n' \
                    "$GOOGLE_OAUTH_CLIENT_ID" "$GOOGLE_OAUTH_CLIENT_SECRET" > .env.local

            - name: Build release packages (shared → mcp-google → plugin; app is experimental and NOT part of the plugin release)
              run: npm run build:shared && npm run build:mcp-google && npm run build:plugin

            - name: Verify release artifacts present
              run: |
                  ls -lh packages/plugin/main.js
                  ls -lh packages/plugin/manifest.json
                  ls -lh packages/plugin/styles.css
                  ls -lh packages/plugin/mcp-server.js

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  # Prefer RELEASE-v{tag}.md notes if present, fallback to auto-generated
                  notes_flag="--generate-notes"
                  if [ -f "packages/plugin/RELEASE-v${tag}.md" ]; then
                    notes_flag="--notes-file packages/plugin/RELEASE-v${tag}.md"
                  fi

                  gh release create "$tag" \
                    --title="v$tag" \
                    $notes_flag \
                    packages/plugin/main.js \
                    packages/plugin/manifest.json \
                    packages/plugin/styles.css \
                    packages/plugin/mcp-server.js
